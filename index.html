
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Shooter</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    background: radial-gradient(circle at center, #182d50, #03060c);
    font-family: Arial, sans-serif;
    color: white;
}

.app {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
}

header {
    text-align: center;
    padding: 25px;
    color: #00eaff;
    font-size: 25px;
    letter-spacing: 5px;
    text-shadow: 0 0 20px #00eaff;
}

.hud {
    display: flex;
    justify-content: space-around;
    margin: 15px;
    padding: 15px;
    border: 1px solid #00eaff;
    border-radius: 15px;
    background: rgba(0, 20, 40, 0.7);
    box-shadow: 0 0 15px #00eaff44;
}

.hud div {
    text-align: center;
}

.label {
    font-size: 11px;
    color: #8ba6c5;
}

.value {
    font-size: 20px;
    color: #00eaff;
    margin-top: 5px;
}

.city {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 45%;
    display: flex;
    align-items: flex-end;
    justify-content: space-around;
}

.building {
    background: linear-gradient(180deg, #152640, #060b16);
    border: 1px solid #243b5c;
    width: 15%;
    position: relative;
}

.building:nth-child(1) { height: 75%; }
.building:nth-child(2) { height: 100%; }
.building:nth-child(3) { height: 60%; }
.building:nth-child(4) { height: 85%; }
.building:nth-child(5) { height: 55%; }

.building::after {
    content: "";
    position: absolute;
    inset: 10px;
    background-image:
        repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 20px,
            #00eaff33 21px,
            #00eaff33 24px
        ),
        repeating-linear-gradient(
            90deg,
            transparent 0px,
            transparent 15px,
            #00eaff22 16px,
            #00eaff22 18px
        );
}

.web {
    position: absolute;
    left: 50%;
    bottom: 180px;
    width: 4px;
    height: 0;
    background: white;
    box-shadow: 0 0 15px white;
    transform: rotate(-25deg);
    transform-origin: bottom;
    transition: height 0.2s;
    z-index: 5;
}

.web.active {
    height: 350px;
}

.target {
    position: absolute;
    top: 35%;
    right: 15%;
    width: 90px;
    height: 90px;
    border: 2px solid #00eaff;
    border-radius: 50%;
    box-shadow: 0 0 20px #00eaff;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #00eaff;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.15); opacity: 1; }
}

.controls {
    position: absolute;
    bottom: 30px;
    width: 100%;
    text-align: center;
    z-index: 10;
}

button {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    border: 4px solid #00eaff;
    background: radial-gradient(circle, #0c4970, #03101f);
    color: white;
    font-size: 20px;
    font-weight: bold;
    box-shadow: 0 0 30px #00eaff66;
    cursor: pointer;
    touch-action: manipulation;
}

button:active {
    transform: scale(0.9);
    background: #00eaff;
    color: black;
}

.message {
    margin-top: 15px;
    color: #00eaff;
    letter-spacing: 2px;
}

</style>
</head>

<body>

<div class="app">

<header>🕷 WEB SHOOTER</header>

<div class="hud">
    <div>
        <div class="label">WEB FLUID</div>
        <div class="value" id="fluid">100%</div>
    </div>

    <div>
        <div class="label">TARGET</div>
        <div class="value">LOCKED</div>
    </div>

    <div>
        <div class="label">SHOTS</div>
        <div class="value" id="shots">0</div>
    </div>
</div>

<div class="target">TARGET</div>

<div class="web" id="web"></div>

<div class="city">
    <div class="building"></div>
    <div class="building"></div>
    <div class="building"></div>
    <div class="building"></div>
    <div class="building"></div>
</div>

<div class="controls">

    <button onclick="shootWeb()">
        🕸<br>
        SHOOT WEB
    </button>

    <div class="message" id="message">
        SYSTEM READY
    </div>

</div>

</div>

<script>

let shots = 0;
let fluid = 100;

function shootWeb() {

    if (fluid <= 0) {
        document.getElementById("message").innerText =
            "WEB FLUID EMPTY!";
        return;
    }

    shots++;
    fluid -= 5;

    document.getElementById("shots").innerText = shots;
    document.getElementById("fluid").innerText = fluid + "%";

    document.getElementById("message").innerText =
        "WEB FIRED! 🕸";

    const web = document.getElementById("web");

    web.classList.remove("active");

    void web.offsetWidth;

    web.classList.add("active");

    setTimeout(() => {
        web.classList.remove("active");
    }, 500);

}

</script>

</body>
</html>
